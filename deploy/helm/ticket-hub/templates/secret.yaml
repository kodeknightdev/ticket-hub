{{- if and (eq .Values.secrets.provider "kubernetes") .Values.secrets.create }}
# Used when secrets.provider=kubernetes (local clusters, dev). With secrets.provider=keyvault the pods
# mount Key Vault through the CSI driver instead and this Secret is not rendered.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    app.kubernetes.io/part-of: ticket-hub
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ tpl (toString $v) $ | quote }}
  {{- end }}
{{- end }}
