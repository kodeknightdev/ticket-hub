{{- if .Values.secrets.create }}
# Placeholder secret for dev clusters. In prod create it from Key Vault (CSI driver or an external
# secrets operator) and set secrets.create=false.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    app.kubernetes.io/part-of: ticket-hub
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
