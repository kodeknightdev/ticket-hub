apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/part-of: ticket-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    # Federated with the user-assigned identity created in infra/terraform/modules/federated-identity
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.workloadIdentity.tenantId | quote }}
  {{- end }}
