global:
  imageTag: "1.0.0"
  imagePullPolicy: Always

secrets:
  # every secret is read from Key Vault through the CSI driver, using the workload identity
  provider: keyvault
  keyVault:
    name: th-prod-uks-kv

ingress:
  appHost: app.tickethub.example.com
  dashboardHost: dashboard.tickethub.example.com
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

forecastCronJob:
  enabled: true
  schedule: "15 * * * *"

services:
  identity: { replicas: 3 }
  events: { replicas: 3 }
  seating:
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 20, cpu: 55 }
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }
  orders:
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 12, cpu: 60 }
  analytics:
    replicas: 2
    env:
      SERVICE_NAME: analytics
      KAFKA_GROUP_ID: analytics
      AUTO_MIGRATE: "true"
      # the CronJob owns retraining in prod; replicas only refresh rollups
      SCHEDULER_ENABLED: "true"
  ticketing-bff:
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 20, cpu: 55 }
  dashboard-bff: { replicas: 2 }
  ticketing-frontend: { replicas: 3 }
  dashboard-frontend: { replicas: 2 }
