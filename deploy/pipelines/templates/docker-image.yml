parameters:
  - name: name
    type: string
  - name: dockerfile
    type: string
  - name: context
    type: string
    default: $(Build.SourcesDirectory)

steps:
  - task: Docker@2
    displayName: Build and push ${{ parameters.name }}
    condition: and(succeeded(), ne(variables['shouldBuild'], 'false'))
    inputs:
      command: buildAndPush
      containerRegistry: acr-connection
      repository: ${{ parameters.name }}
      Dockerfile: ${{ parameters.dockerfile }}
      buildContext: ${{ parameters.context }}
      tags: |
        $(Build.BuildId)
        $(Build.SourceVersion)
