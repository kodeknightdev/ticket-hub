parameters:
  - name: resourceGroup
    type: string
  - name: cluster
    type: string

steps:
  - task: AzureCLI@2
    displayName: Hit every /health endpoint from inside the cluster
    inputs:
      azureSubscription: azure-arm-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az aks get-credentials -g ${{ parameters.resourceGroup }} -n ${{ parameters.cluster }} --overwrite-existing
        kubelogin convert-kubeconfig -l azurecli
        targets="th-identity th-events th-seating th-orders th-notifier th-pricing th-analytics th-ticketing-bff th-dashboard-bff"
        kubectl -n ticket-hub run smoke-$(Build.BuildId) --rm -i --restart=Never --image=curlimages/curl:8.12.1 -- sh -c "
          failed=0
          for t in $targets; do
            if curl -fsS --max-time 10 http://\$t/health >/dev/null; then echo \"ok   \$t\"; else echo \"FAIL \$t\"; failed=1; fi
          done
          exit \$failed"
